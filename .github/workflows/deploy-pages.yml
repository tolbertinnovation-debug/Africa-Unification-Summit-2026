name: Mirror original summit website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - scripts/mirror_original.py
      - templates/about-page.html
      - templates/schedule-content.html
      - templates/organizer-content.html
      - templates/speakers-content.html
      - templates/about-the-host-content.html
      - templates/blog-content.html
      - templates/contact-content.html
      - templates/become-a-partner-content.html
      - assets/about-page.css
      - assets/about-shell.css
      - assets/schedule-page.css
      - assets/standard-pages.css
      - assets/partner-form.css
      - assets/partner-form.js
      - assets/responsive-polish.css
      - assets/summit-interactions.js

permissions:
  contents: write

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pages and original assets
        run: python3 scripts/mirror_original.py

      - name: Save the static mirror in the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about-us event-schedule organizer speakers about-the-host blog contact become-a-partner wp-content wp-includes
          if git diff --cached --quiet; then
            echo "The static mirror is already current."
          else
            git commit -m "Mirror original summit website"
            git push
          fi
