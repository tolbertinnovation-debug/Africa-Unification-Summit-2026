name: Mirror original summit website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml

permissions:
  contents: write

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pages and original assets
        run: python3 scripts/mirror_original.py

      - name: Save the static mirror in the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about-us event-schedule organizer speakers about-the-host blog contact wp-content wp-includes
          if git diff --cached --quiet; then
            echo "The static mirror is already current."
          else
            git commit -m "Mirror original summit website"
            git push
          fi
